name: One-time Amaara factual repair
on:
  push:
    branches: [master]
    paths: ['.github/workflows/sharpsites-one-time-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Preserve design; correct exact Google details and single WhatsApp control
        shell: python
        run: |
          from pathlib import Path
          import json
          from bs4 import BeautifulSoup
          p=Path('index.html'); source=p.read_text(); s=BeautifulSoup(source,'html.parser')
          assert 'Amaara Farms' in source and '919650976077' in source
          for text in list(s.find_all(string=lambda x:x and 'To be confirmed by the venue' in x)):
              text.replace_with(str(text).replace('To be confirmed by the venue','Monday–Sunday, 11:00 AM–8:00 PM (Google listing). Call before visiting; event schedules may differ.'))
          visit=s.select_one('#visit')
          assert visit is not None
          for text in list(visit.find_all(string=True)):
              if 'Main Chhatarpur Rd, Bhatti Kalan,' in str(text):
                  text.replace_with(str(text).replace('Main Chhatarpur Rd, Bhatti Kalan,','Mandir Rd, A-12, Amaara Farms, Main Chhatarpur Rd, Bhatti Kalan,'))
          links=s.select('a[href*="wa.me/"]'); assert len(links)>=1
          keep=links[-1]
          for a in links[:-1]:
              a['href']='tel:+919650976077'; a.clear(); a.append('Call the venue')
              a.attrs.pop('aria-label',None)
          keep['href']='https://wa.me/919650976077'
          keep['aria-label']='Chat with Amaara Farms on WhatsApp'
          keep['style']='position:fixed;right:18px;bottom:18px;width:58px;height:58px;min-width:58px;min-height:58px;border-radius:50%;background:#25d366;color:white;display:flex;align-items:center;justify-content:center;z-index:100;box-shadow:0 4px 18px #0003;padding:0'
          keep.clear()
          keep.append(BeautifulSoup('<svg viewBox="0 0 32 32" width="31" height="31" aria-hidden="true"><path fill="white" d="M16 1a15 15 0 0 0-13 22.5L1 31l7.7-2A15 15 0 1 0 16 1zm0 27.5a12.5 12.5 0 0 1-6.4-1.8l-.5-.3-4.5 1.2 1.2-4.4-.3-.5A12.5 12.5 0 1 1 16 28.5z"/><path fill="white" d="M23 19c-.4-.2-2.2-1.1-2.5-1.2-.4-.1-.6-.2-.8.2l-1.2 1.4c-.2.2-.4.3-.8.1a10.5 10.5 0 0 1-5-4.3c-.2-.4 0-.6.2-.8l.6-.7c.3-.4.4-.8.3-1.1l-1.1-2.8c-.3-.7-.6-.6-.9-.6h-.7c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.4 3.6 1.6 3.9 2.6 4 6.4 5.6c1.8.8 3.3 1.2 4.4 1 .7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.1-.3-.2-.7-.4z"/></svg>','html.parser'))
          for frame in list(s.select('iframe')):
              if 'map' in frame.get('src','').lower(): frame.decompose()
          foot=s.find('footer'); assert foot is not None
          if '[Add Google Maps embed]' not in foot.get_text():
              slot=s.new_tag('div'); slot['style']='min-height:260px;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center'; slot.string='[Add Google Maps embed]'; foot.insert(0,slot)
          note=s.new_tag('p'); note['style']='text-align:center;padding:16px;font-size:12px'; note.string='Website preview: photographs and package prices are design placeholders. Confirm the final details directly with the venue.'
          foot.insert_before(note)
          schema={'@context':'https://schema.org','@type':'LocalBusiness','name':'Amaara Farms','telephone':'+919650976077','url':'https://ritik-sharma1.github.io/','address':{'@type':'PostalAddress','streetAddress':'Mandir Rd, A-12, Amaara Farms, Main Chhatarpur Rd, Bhatti Kalan','addressLocality':'New Delhi','addressRegion':'Delhi','postalCode':'110074','addressCountry':'IN'},'openingHours':['Mo-Su 11:00-20:00']}
          for script in list(s.select('script[type="application/ld+json"]')):script.decompose()
          script=s.new_tag('script',type='application/ld+json'); script.string=json.dumps(schema);s.head.append(script)
          assert len(s.select('a[href*="wa.me/"]'))==1
          assert '11:00 AM–8:00 PM' in s.get_text() and s.find('footer').get_text(' ',strip=True).endswith('Made with ❤️ by SharpSites')
          p.write_text(str(s))
          Path('.github/workflows/sharpsites-one-time-repair.yml').unlink()
      - name: Commit the bounded repair
        run: |
          git config user.name 'SharpSites factual repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/sharpsites-one-time-repair.yml
          git commit -m 'Correct Amaara Google details and one WhatsApp control; preserve design and root URL'
          git push origin HEAD:master
