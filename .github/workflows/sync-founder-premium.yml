name: Founder portfolio visual QA
on:
  push:
    branches: [master]
    paths: ['.github/workflows/sync-founder-premium.yml']
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up isolated browser check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/portfolio-qa"
          cd "$RUNNER_TEMP/portfolio-qa"
          npm install --no-audit --no-fund playwright-core@1.55.0
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"
      - name: Capture published page without sending messages
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/portfolio-qa"
          cat > check.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox']});
            const checks=[];
            for (const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]) {
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,reducedMotion:'reduce',hasTouch:name==='mobile'});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('https://ritik-sharma-work.pages.dev/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.evaluate(()=>document.fonts.ready);
              await page.waitForTimeout(5000);
              const identity=await page.evaluate(()=>({title:document.title,h1:document.querySelector('h1').innerText,overflow:document.documentElement.scrollWidth>innerWidth,bodyFont:getComputedStyle(document.body).fontFamily,headingFont:getComputedStyle(document.querySelector('h1')).fontFamily,loadedFonts:[...document.fonts].filter(f=>f.status==='loaded').map(f=>f.family)}));
              await page.screenshot({path:name+'-hero.png',fullPage:false});
              await page.locator('#work').scrollIntoViewIfNeeded();await page.waitForTimeout(3000);
              await page.screenshot({path:name+'-work.png',fullPage:false});
              await page.locator('[data-filter="systems"]').click();
              const systemCount=await page.locator('.project:visible').count();
              await page.locator('#open-system').click();const dialogOpen=await page.locator('#system-note').evaluate(d=>d.open);
              await page.keyboard.press('Escape');
              await page.locator('[data-filter="all"]').click();
              await page.locator('#task').fill('QA preview only: website copy & layout');
              await page.locator('#budget').fill('To discuss');
              await page.locator('#brief-form button[type=submit]').click();
              const link=await page.locator('#send-message').getAttribute('href');
              const draftValid=link.startsWith('https://wa.me/919560857654?text=')&&decodeURIComponent(link).includes('website copy & layout');
              await page.locator('#contact').scrollIntoViewIfNeeded();await page.screenshot({path:name+'-contact.png',fullPage:false});
              await page.evaluate(()=>{document.querySelector('#message-preview').hidden=true;document.querySelector('#task').value='';document.querySelector('#budget').value=''});
              for(const id of ['services','about']){await page.locator('#'+id).scrollIntoViewIfNeeded();await page.screenshot({path:name+'-'+id+'.png',fullPage:false})}
              await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(500);
              await page.screenshot({path:name+'-full.png',fullPage:true});
              checks.push({name,width,height,status:response.status(),...identity,systemCount,dialogOpen,draftValid,errors});
              await context.close();
            }
            fs.writeFileSync('checks.json',JSON.stringify(checks,null,2));
            await browser.close();
            if(checks.some(c=>c.status!==200||c.overflow||c.systemCount!==1||!c.dialogOpen||!c.draftValid))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: founder-premium-visual-qa
          path: |
            ${{ runner.temp }}/portfolio-qa/*.png
            ${{ runner.temp }}/portfolio-qa/checks.json
          retention-days: 3
