name: Sync founder-premium portfolio source
on:
  push:
    branches: [master]
    paths: ['.github/workflows/sync-founder-premium.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Fetch and verify exact approved HTML
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 'https://ritik-sharma-work.pages.dev/' -o /tmp/portfolio.html
          echo 'a360530bb19d9e9d19799bfc43c9bfb7c75c84d1b4bb5db7bb0b62bc21930313  /tmp/portfolio.html' | sha256sum --check --strict
          cp /tmp/portfolio.html work-portfolio/index.html
      - name: Commit only the verified portfolio source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- work-portfolio/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- work-portfolio/index.html
          git commit -m 'Publish Poppins/Boska plum-and-gold portfolio source'
          git push origin HEAD:master
